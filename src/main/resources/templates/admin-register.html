<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Registration Successful</title>
    <style>
        body {
          font-family: "Segoe UI", Arial, sans-serif;
          background-color: #f4f6f8;
          margin: 0;
          padding: 30px;
        }

        .container {
          max-width: 600px;
          background: #ffffff;
          border-radius: 12px;
          margin: auto;
          padding: 30px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header {
          text-align: center;
          background-color: #1976d2;
          color: #ffffff;
          padding: 15px;
          border-radius: 12px 12px 0 0;
        }

        .header h2 {
          margin: 0;
          font-size: 22px;
        }

        .content {
          margin-top: 20px;
          line-height: 1.6;
          color: #333333;
        }

        .highlight {
          color: #1976d2;
          font-weight: 600;
        }

        .footer {
          text-align: center;
          font-size: 12px;
          color: #888;
          margin-top: 30px;
          border-top: 1px solid #eee;
          padding-top: 10px;
        }

        .btn {
          display: inline-block;
          background-color: #1976d2;
          color: white;
          padding: 10px 20px;
          text-decoration: none;
          border-radius: 6px;
          margin-top: 15px;
          font-weight: 500;
        }

        .btn:hover {
          background-color: #125aa0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Welcome to iCare, Admin!</h2>
    </div>

    <div class="content">
        <p>Welcome <span class="highlight"> [Admin Name]. You are now an admin</span>,</p>
    </div>

    <div class="footer">
        © 2025 iCare | All Rights Reserved<br>
        Need help? Contact us at <a href="mailto:support@icare.com">support@icare.com</a>
    </div>
</div>
</body>
</html>
